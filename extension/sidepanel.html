<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    :root {
      --term-bg:  #1e1e1e;
      --ui-fg:    #cccccc;
      --ui-dim:   #666666;
      --ui-input: #2d2d2d;
      --ui-border:#444444;
      --ui-accent:#0078d4;
    }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; background: var(--term-bg); }

    /* ── shared bar styles ── */
    .bar {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 6px;
      background: var(--term-bg);
      border-bottom: 1px solid var(--ui-border);
      flex-shrink: 0;
    }

    /* ── buttons ── */
    .btn {
      padding: 3px 10px;
      background: var(--ui-input);
      color: var(--ui-fg);
      border: 1px solid var(--ui-border);
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn:hover:not(:disabled) { filter: brightness(1.2); }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn.active { background: var(--ui-accent); color: #fff; border-color: var(--ui-accent); }

    /* ── info display ── */
    #info {
      flex: 1;
      background: var(--ui-input);
      color: var(--ui-dim);
      border: 1px solid var(--ui-border);
      border-radius: 3px;
      padding: 3px 7px;
      font-size: 11px;
      font-family: monospace;
      white-space: pre-wrap;
      overflow-y: auto;
      max-height: 80px;
      word-break: break-all;
    }
    #info.selected { color: var(--ui-fg); }

    /* ── theme dropdown ── */
    #theme-select {
      background: var(--ui-input);
      color: var(--ui-fg);
      border: 1px solid var(--ui-border);
      border-radius: 3px;
      font-size: 11px;
      padding: 2px 6px;
      cursor: pointer;
    }
    #theme-select:focus { outline: none; border-color: var(--ui-accent); }
    #config-btn { margin-left: auto; font-size: 13px; padding: 2px 7px; }

    /* ── config dialog ── */
    #config-dialog {
      display: none;
      position: fixed;
      top: 32px;
      right: 6px;
      z-index: 100;
      background: var(--term-bg);
      border: 1px solid var(--ui-border);
      border-radius: 4px;
      padding: 12px;
      width: 270px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      font-size: 11px;
      color: var(--ui-fg);
    }
    #config-dialog.visible { display: block; }
    .cfg-field { display: flex; flex-direction: column; gap: 3px; margin-bottom: 10px; }
    .cfg-field label { color: var(--ui-dim); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    #config-host {
      background: var(--ui-input);
      color: var(--ui-fg);
      border: 1px solid var(--ui-border);
      border-radius: 3px;
      font-size: 11px;
      padding: 3px 7px;
      font-family: monospace;
    }
    #config-host:focus { outline: none; border-color: var(--ui-accent); }
    .cfg-url-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .cfg-url-row .cfg-label { color: var(--ui-dim); }
    .cfg-url-row .cfg-url   { font-family: monospace; color: var(--ui-fg); opacity: 0.6; }
    .cfg-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 12px; }
    #config-save { background: var(--ui-accent); color: #fff; border-color: var(--ui-accent); }

    /* ── open panel ── */
    #open-panel {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 5px 6px;
      background: var(--term-bg);
      border-bottom: 1px solid var(--ui-border);
      flex-shrink: 0;
    }
    #open-panel.visible { display: flex; }
    #url-input {
      flex: 1;
      background: var(--ui-input);
      color: var(--ui-fg);
      border: 1px solid var(--ui-border);
      border-radius: 3px;
      font-size: 11px;
      padding: 3px 7px;
      font-family: monospace;
    }
    #url-input::placeholder { color: var(--ui-dim); }
    #url-input:focus { outline: none; border-color: var(--ui-accent); }
    .sep { color: var(--ui-dim); font-size: 11px; flex-shrink: 0; }

    /* ── send row ── */
    #send-input {
      flex: 1;
      background: var(--ui-input);
      color: var(--ui-fg);
      border: 1px solid var(--ui-border);
      border-radius: 3px;
      font-size: 11px;
      padding: 3px 7px;
      font-family: monospace;
      resize: none;
      line-height: 1.5;
    }
    #send-input::placeholder { color: var(--ui-dim); }
    #send-input:focus { outline: none; border-color: var(--ui-accent); }

    #terminal-wrap { flex: 1; position: relative; }
    #terminal-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; display: block; }

    #send-bar { align-items: flex-end; }
  </style>
</head>
<body>

  <!-- config dialog (floating) -->
  <div id="config-dialog">
    <div class="cfg-field">
      <label>Host</label>
      <input id="config-host" type="text" placeholder="localhost" spellcheck="false">
    </div>
    <div class="cfg-url-row">
      <span class="cfg-label">Terminal</span>
      <span class="cfg-url" id="cfg-term-url">https://localhost:7681</span>
    </div>
    <div class="cfg-url-row">
      <span class="cfg-label">Helper</span>
      <span class="cfg-url" id="cfg-helper-url">https://localhost:7682</span>
    </div>
    <div class="cfg-actions">
      <button class="btn" id="config-cancel">Cancel</button>
      <button class="btn" id="config-save">Save</button>
    </div>
  </div>

  <!-- top row: actions left, theme right -->
  <div class="bar">
    <button class="btn" id="open-btn">Open URL</button>
    <button class="btn" id="publish-btn" disabled>Publish</button>
    <button class="btn" id="config-btn" title="Settings">&#9881;</button>
    <select id="theme-select">
      <option value="dark">Dark</option>
      <option value="light">Light</option>
      <option value="solarized">Solarized Dark</option>
      <option value="dracula">Dracula</option>
      <option value="onedark">One Dark</option>
    </select>
  </div>

  <!-- open panel (hidden until Open is clicked) -->
  <div id="open-panel">
    <input type="text" id="url-input" placeholder="https://... or file:///path/to/file.html">
    <button class="btn" id="url-go">Open</button>
  </div>

  <!-- inspector row -->
  <div class="bar" style="align-items:flex-start">
    <button class="btn" id="pick-btn">Select</button>
    <div id="info">—</div>
    <button class="btn" id="clear-btn">Clear</button>
  </div>

  <!-- send row -->
  <div class="bar" id="send-bar">
    <textarea id="send-input" rows="3" placeholder="Send to terminal… (Shift+Enter for newline)"></textarea>
    <button class="btn" id="send-btn">Send</button>
  </div>

  <div id="terminal-wrap">
    <iframe id="terminal"></iframe>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
